title: Thunderbird Metrics and Reports
description: Hourly updated blog with Thunderbird support metrics
baseurl: "/thunderbird-metrics-and-reports"
url: "https://thunderbird.github.io"
remote_theme: jekyll/minima
timezone: UTC

minima:
  nav_pages:
    - pages.md

plugins:
  - jekyll-feed
  - jekyll-sitemap

include:
  - UNANSWERED_QUESTIONS

exclude:
  - CONCATENATED_FILES
  - get_trusted_and_untrusted_synthetic_solved.rb
  - desktop-tags-bargraph-jan-feb-2026.py
  - requirements.txt
  - rough-sketch.R
  - sumo-tb-android-concat-all-questions-answers
  - sumo-tb-android-create-monthly-csv
  - sumo-tb-desktop-concat-all-questions-answers
  - sumo-tb-desktop-create-monthly-csv
  - .github
  - scripts
  - CLAUDE.md
  # LLM Insights: publish only the rendered reports under LLM_INSIGHTS/REPORTS/,
  # not the internal working note or the per-question label CSVs.
  - LLM_INSIGHTS/BUCKET2-CHECKPOINT.md
  - LLM_INSIGHTS/COSTS.md
  - LLM_INSIGHTS/2026-05-desktop-labels.csv
  - LLM_INSIGHTS/2026-06-desktop-labels.csv
  - LLM_INSIGHTS/2026-05-android-labels.csv
  - LLM_INSIGHTS/2026-06-android-labels.csv
