name: gha-tb-update-website

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history to detect changes
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: uv pip install -r requirements.txt

    - name: Generate HTML reports from CSV files
      run: uv run ./scripts/generate_reports.py

    - name: Check for changes
      id: check_changes
      run: |
        if git status --porcelain | grep -q .; then
          echo "Changes detected"
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "No changes detected"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        COMMIT_MSG="Update reports at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        git commit -m "$COMMIT_MSG"
        git push

    - name: Pull latest commits before building
      run: git fetch origin && git reset --hard origin/main

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
